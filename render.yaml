services:
  - type: web
    name: modul-izobrazheniy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # DATABASE_URL задаётся вручную в дашборде Render (внешняя база Supabase).
      # sync: false — чтобы синхронизация blueprint не перетирала это значение.
      - key: DATABASE_URL
        sync: false
