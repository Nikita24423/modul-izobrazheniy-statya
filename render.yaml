services:
  - type: web
    name: modul-izobrazheniy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: modul-izobrazheniy-db
          property: connectionString

databases:
  - name: modul-izobrazheniy-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
